
# schema-frontmatter.yaml
# Canonical YAML front-matter schema for all Markdown files (except README.md)

required:
  - title
  - type
  - product
  - vendor
  - domain
  - llm_use
  - source
  - prerequisites
  - inputs
  - outputs
  - state_effect
  - tags

enums:
  type:
    - command
    - endpoint
    - function
    - concept
    - reference
    - index
  llm_use:
    - procedural
    - reference
    - conceptual
  state_effect:
    - creates
    - updates
    - deletes
    - queries
    - none

# Fields and expected types
fields:
  title: string            # Exact symbolic name (e.g., POST_Login, GET_Client)
  type: string             # One of enums.type
  product: string          # e.g., Commvault Platform
  vendor: string           # e.g., Commvault
  language: string|null    # CLI or programming language, if applicable; else omit or null
  domain: string           # Functional grouping (e.g., authentication, client, agent)
  llm_use: string          # One of enums.llm_use
  prerequisites: list      # Explicit dependencies/setup notes
  inputs: string|list|null # "string" for textual description, "list" for enumerated params, or null
  outputs: string|list|null# "string" for textual description, "list" for enumerated response fields, or null
  state_effect: string     # One of enums.state_effect
  tags: list               # Keywords
  source:                  # Canonical citation of origin
    type: string           # Always "pdf"
    title: string          # PDF title
    section: string|null   # Section heading if known; else omit or null
